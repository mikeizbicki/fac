name: tests-golden

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  tests:
    strategy:
      matrix:
        python: [3.12]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Initialize specific submodules
        run: |
          git submodule update --init --recursive tests/fac_test*
          git submodule update --init --recursive tests/facd_test*
      - name: Set up Python ${{matrix.python}}
        uses: actions/setup-python@v2
        with:
          python-version: ${{matrix.python}}
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: install fac
        env:
          # hardcoded version number needed to fix a race condition in the automatic version numbering
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          pip3 install -e .
      - name: run tests
        run: |
          cd tests
          ./run_all_tests.sh

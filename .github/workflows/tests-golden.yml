name: tests-golden

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  tests:
    strategy:
      matrix:
        python: [3.12]
    runs-on: ubuntu-latest
    env:
      # we set PYTHONPATH here so that `python3 -m fac` can find the module
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Initialize specific submodules
        run: |
          git submodule update --init --recursive tests/fac_test*
      - name: Set up Python ${{matrix.python}}
        uses: actions/setup-python@v2
        with:
          python-version: ${{matrix.python}}
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: install fac
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          pip3 install .
      - name: fac_test1_basicproject
        run: |
          cd tests/fac_test1_basicproject
          ./run_test.sh
      - name: fac_test2_dependency_only_variables
        run: |
          cd tests/fac_test2_dependency_only_variables
          ./run_test.sh
      - name: fac_test3_postreqs
        run: |
          cd tests/fac_test3_postreqs
          ./run_test.sh
      - name: fac_test4_dependency_only_variables
        run: |
          cd tests/fac_test4_dependency_only_variables
          ./run_test.sh
      - name: fac_test5_variable_inheritance
        run: |
          # removed this feature
          #cd tests/fac_test5_variable_inheritance
          #./run_test.sh
      - name: fac_test6_recursive_dependencies
        run: |
          cd tests/fac_test6_recursive_dependencies
          ./run_test.sh
